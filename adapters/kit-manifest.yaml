    source: adapters/kit-manifest.yaml
    target: adapters/kit-manifest.yaml
  - role: template
    source: adapters/kit-templates/project-spec.yaml.template
    target: adapters/project-spec.yaml
  - role: template
    source: adapters/kit-templates/settings.json.template
    target: .claude/settings.json
