# Decision 0012: the portable kit. This file is the only definition of what leaves PAES.
# Roles: copy = byte-identical, digest-checked in the target; template = placeholders {{project_name}},
# {{origin_commit}}, {{verification_command}} filled at install time, not digest-checked; optional = exported with
# the kit and written into a target only when the installer is asked (kit v6: `--ci`), rendered like a template. Parsed by
# scripts/kit.py (standard library). Version 2 (2026-09-27): settings.json is a template whose allow
# list names only kit scripts; PAES keeps its own richer settings.json as the rendered instance.
# Version 3 (2026-09-28): permissions.disableBypassPermissionsMode is the string "disable", the only value
# the settings schema accepts; the boolean true of versions one and two had the whole file skipped.
# Version 4 (2026-09-28, Decision 0014): adapters/project-spec.yaml is a template, the one place where a target
# declares its roles, verification command, hand-off pointer, integration path, guidance files and limits;
# the kit's AGENTS.md renders from it and kit-project-spec verifies it.
# Version 5 (2026-09-28, findings 2, 3 and 5 of the third chargewatch-gr trial): the report's count excludes the
# no-bypass value it names on its own line, the specification template shows how limits are written, and the
# checklist ends with the prompt a maintainer pastes into the first session to test the kit.
# Version 6 (2026-09-29, Decision 0017): the push script, split into a provider-neutral core and a review backend named
# by the specification's `integration` field, joins the kit with its tests and its allow entry; a third skill,
# publish-increment; every kit skill has one shape, read by the `kit-skills` check; the GitHub CI workflow is an
# optional template written only behind `--ci`.
# Version 7 (2026-10-01, Decision 0018): the notice carries the MIT grant, the copyright line and the full MIT text;
# the scope of the grant is exactly the entries of this manifest at the origin commit, while inside the origin the
# same files stay AGPL-3.0-only. No entry changes.
# Version 8 (2026-10-01, findings 1 and 2 of the fourth chargewatch-gr trial): the installer proposes a ruff exclude for the
# kit's digest-checked Python copies when the target configures ruff; the width-independent rule hits in kit.py (F401) and
# commit_rules.py (UP035) are fixed at the source, while those in pilot_core.py (I001, UP035) stay, its bytes being bound by
# the implementation digests of the pilot run records; the GitHub CI template pins actions/checkout by commit SHA, disables
# credential persistence and no longer sets up Python, the runner's python3 being enough for a standard-library verifier.
# No entry changes.
# Version 9 (2026-10-02, roadmap refinement 2026-10-01 rulings 4 and 9): the secrets guard hook also covers the read side;
# a Read, Grep or Glob whose file path, search path, glob or pattern names a secret-bearing file by path component (.env
# and its dotted variants, .envrc, private key files, .netrc and similar credential files, any secrets.* file) is blocked
# with the rule name only; placeholder copies such as .env.example stay readable; the PreToolUse matcher of the settings
# template gains Read|Grep|Glob. A target that already carries the old matcher receives no proposal for the new one.
# No entry changes.
# Version 10 (2026-10-03, findings 1, 3 and 4 of the fifth chargewatch-gr trial): the read-side guard evaluates a path
# component that carries a wildcard as a pattern instead of deleting its wildcards: a finding when it can reach a secret name
# and cannot reach an ordinary project file, or when its literal text is itself secret-shaped; id_*, *.p?m, .env.example*
# and credentials.* are blocked, while generic searches such as *.json and placeholders such as .env.example and *.example
# stay readable; the installer
# makes no CI proposal when the target already has the optional entry's file and lists it as skipped. Entry changes:
# scripts/test_hooks.py joins as a copy, beside the hooks; scripts/test_kit.py and scripts/test_verify_kit.py leave the kit,
# since they read origin-only templates and cannot run in a target.
# Version 11 (2026-10-03, findings 1 to 3 of the sixth chargewatch-gr trial): the read-side guard samples a negated class
# [!...] with a character the class does not exclude, so .env.e[!x]ample is blocked and *.pf[!x] stays readable; the
# installer refuses an existing report, or a report path that names a file the kit writes, before its first write, so a
# refused install leaves no new file behind and the report overwrites nothing; the
# installer keeps its closed version list, and its refusal, the checklist and adapters/README.md say that an upgrade runs
# the kit.py the newer export ships, never the installed one. No entry changes.
# Version 12 (2026-10-06, the upgrade in place, open since the fifth chargewatch-gr trial and record 4 of the seventh
# trial's field confirmation): `install --upgrade` over an
# installed kit overwrites a copy only when the target file still carries the digest the installed KIT_NOTICE.md recorded
# for it, reports a copy already at the export's digest as unchanged, writes a missing one and refuses a modified one, or
# one that is a symbolic link, a directory or a path that resolves outside the target, by name with a proposal; templates, the settings file and AGENTS.md keep install behaviour; the notice is rewritten with the
# export's digests, the target's own files staying `skipped`; a target without a notice is refused before any write. The
# bump also folds in the digest drift of scripts/test_hooks.py under version eleven. No entry changes.
# Version 13 (2026-10-06, the review lane's fifth finding on version twelve and the eighth chargewatch-gr trial's open items,
# ruled by the owner): the link check is per component: an upgrade refuses a copy, and the notice, when any component of
# its path below the target is a symbolic link, wherever the link points, so a linked directory that stays inside the target
# no longer routes a write into a nested checkout; an upgrade appends one dated line, from the old origin commit and kit
# version to the new, files written and copies refused, to an `## Upgrades` section of the rewritten notice before the
# licence, the earlier lines carried forward, so the target keeps a record beside the commit while the first install's
# report stays refused; the notice and the checklist name the rule 6 routine that retires a merged increment branch the
# push script created. The version-bump guard is left for a decision. No entry changes.
# Version 14 (2026-10-07, the trial-9 sandbox gaps on linetally and the chargewatch-gr Dependabot hand-off, ruled by the owner
# that day; three lanes): the hygiene lane exempts a bot's Signed-off-by only for an author email listed under `bot_authors`
# in the specification and documents squash merges in the contribution policy without a code exemption; the push lane gives
# the push script a REST fallback through `gh api`, never GraphQL, and names the route in its report; the sandbox lane adds
# the optional specification fields `sandbox` (`on` or `off`, absent means off) and `bot_authors`, renders a sandbox block
# into a new settings file under `sandbox: on` (gh excluded, the review backend's domain allowed) with a proposal for
# `.worktrees/` in the target's .gitignore, marks a kit-written copy the target changed as `modified` in the notice, not
# digest-checked, only when the maintainer names it with `install --upgrade --own <path>` (otherwise refused and failing as in
# version twelve; the upgrade line lists the owned paths), gives worktree-flow rule 3 the same-checkout `.worktrees/<slug>` variant and has the
# conform review record a rule whose source file the target lacks as not applicable. No entry changes.
# Version 15 (2026-10-07, the Codex review of kit v14, christiaslab/paes#77, ruled by the owner that day): the sandbox block
# names the push-script command `python3 scripts/push_increment.py *` in `excludedCommands` beside `gh *`, since the
# exclusion matches the text of the Bash call only (exact without the trailing ` *`) and the script launches gh, and allows `*.github.com` beside `github.com`
# for the github backend so the REST fallback reaches api.github.com. No entry changes.
# Version 16 (2026-10-07, the conform tension left open by the context guard increment, christiaslab/paes#85): the kit
# copy of scripts/test_hooks.py carries the context guard's test class, skipped in a target where the script is absent
# (Decision 0024, PAES-only), so an upgrade rewrites the v15 copy and the notice records the new digest. No entry changes.
# Version 17 (2026-10-07, Decision 0025, christiaslab/paes#98 brief): scripts/kit.py gains the `digests` subcommand that writes
# adapters/kit-digests.txt at the origin, the kit_version and one digest per copy, read by the verifier's kit-copy-drift check;
# the record is not an entry and does not travel with the kit. No entry changes.
# Version 18 (2026-10-08, the --draft request and the three kit findings of the forty-sixth session, christiaslab/paes#108): the push
# script gains `--draft`, passed to `gh pr create` and to the REST payload and reported as `"draft"`, so a host with CODEOWNERS
# asks no code owner to review until the maintainer marks the pull request ready; the installer refuses a source that resolves
# to the same tree as the target, records the export's digest for a target-owned copy whose bytes equal the export's on
# upgrade, and warns when a kit test copy tests a target-owned or changed module. No entry changes.
# Version 19 (2026-10-10, the two upgrade findings of the forty-ninth session, christiaslab/paes#113): `--project-name` is optional;
# under `--upgrade` an absent name is read from the target's adapters/project-spec.yaml and refused by name when neither gives one,
# or when the flag is absent without `--upgrade`; the default report of an upgrade is adapters/KIT_UPGRADE_REPORT_<date>_V<version>.md,
# dated today with the export's kit version, so a second upgrade on the same day at a newer version needs no `--report`; the install
# default and the never-overwritten rule stay. No entry changes.
# Version 20 (2026-10-10, the subject-length guidance of the fifty-first session): policies/contribution.md, a copy entry, gains
# the owner's ruling that a commit subject is at most 72 characters with the summary in the body, since the push script takes
# the subject as the pull-request title; documented guidance, not enforced. No code changes. No entry changes.
# Version 21 (2026-10-10, Decision 0026): scripts/verify_kit.py gains a ninth check, `kit-tests`, that runs the kit test
# copies this manifest names and the target has, `scripts/test_<name>.py` not marked `skipped` in the notice, in one
# `python3 -m unittest` call, and reports the count and the result; `--skip-kit-tests` reports it as not run, for a caller
# that runs the modules itself, and kit-project-spec refuses the flag in the declared verification command. No entry changes.
# Version 22 (2026-10-10, Decision 0027): the kit copy of scripts/test_hooks.py asserts the context guard's new thresholds,
# 300,000 and 400,000 for the 1,000,000-token window, and that the old figures no longer warn; the guard itself stays
# PAES-only and skipped in a target. No code changes in the kit. No entry changes.
kit_version: 22
origin: paes
