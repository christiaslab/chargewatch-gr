[project]
name = "chargewatch"
version = "0.1.0"
description = "Agentic analytics over Greek EV-charging open data"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "google-cloud-storage>=3.14.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
