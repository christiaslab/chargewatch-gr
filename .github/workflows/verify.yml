# Written by the PAES portable kit installer (--ci) for chargewatch-gr; edit freely, this file belongs to chargewatch-gr.
# One job: the verification command of adapters/project-spec.yaml, on pull requests to main and on pushes to main,
# with no secrets, no cache and no model; the only network use is the checkout and the Python set-up. Its only artifact is its log.
name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the commit-history rule reads every commit reachable from HEAD
          fetch-depth: 0
          persist-credentials: false
      # the runner image ships python3; the verification command is standard library only
      - name: Run the verification command
        run: |
          python3 scripts/verify_kit.py
